<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jintu & Sam - Engagement Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .card-container {
            max-width: 500px;
            width: 100%;
            perspective: 1000px;
            animation: cardEntrance 1.5s ease;
        }
        
        .card {
            background: linear-gradient(135deg, #f5f5dc 0%, #e8f5e0 50%, #fff8e7 100%);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.5),
                        0 0 0 2px rgba(212, 175, 55, 0.3),
                        inset 0 0 50px rgba(212, 175, 55, 0.05);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card:hover {
            transform: translateY(-15px) rotateX(3deg) scale(1.02);
            box-shadow: 0 50px 130px rgba(0,0,0,0.7),
                        0 0 0 4px rgba(212, 175, 55, 0.7),
                        inset 0 0 80px rgba(212, 175, 55, 0.15),
                        0 0 100px rgba(212, 175, 55, 0.5);
        }
        
        /* Golden shimmer effect - reduced intensity */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 40%,
                rgba(212, 175, 55, 0.1) 50%, 
                transparent 60%);
            animation: shimmer 8s infinite;
            pointer-events: none;
        }
        
        .card::after {
            display: none;
        }
        
        /* Decorative corners */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid #d4af37;
            opacity: 0;
            animation: fadeInCorner 1s ease forwards;
        }
        
        .corner-tl {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
            border-radius: 15px 0 0 0;
            animation-delay: 0.5s;
        }
        
        .corner-tr {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 15px 0 0;
            animation-delay: 0.7s;
        }
        
        .corner-bl {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 15px;
            animation-delay: 0.9s;
        }
        
        .corner-br {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 15px 0;
            animation-delay: 1.1s;
        }
        
        /* Content */
        .content {
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            color: #6b8e23;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
            font-weight: 600;
            opacity: 0;
            animation: fadeInDown 1s ease forwards;
            animation-delay: 0.3s;
        }
        
        /* Decorative top element */
        .decorative-top {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 20px;
            opacity: 0;
            animation: bounceIn 1.2s ease forwards;
            animation-delay: 0.5s;
        }
        
        .decorative-top span {
            display: inline-block;
            animation: float 3s infinite ease-in-out;
        }
        
        .decorative-top span:nth-child(2) {
            animation-delay: 0.5s;
        }
        
        .decorative-top span:nth-child(3) {
            animation-delay: 1s;
        }
        
        .names {
            font-size: 3em;
            text-align: center;
            background: linear-gradient(135deg, #d4af37 0%, #6b8e23 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 25px 0;
            font-family: 'Brush Script MT', cursive;
            opacity: 0;
            animation: slideInScale 1s ease forwards;
            animation-delay: 0.7s;
            text-shadow: 2px 2px 8px rgba(212, 175, 55, 0.4);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }
        
        .ampersand {
            font-size: 0.8em;
            display: inline-block;
            animation: rotate 3s infinite ease-in-out;
        }
        
        .divider {
            width: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, #6b8e23, #d4af37, transparent);
            margin: 30px auto;
            animation: expandWidth 2s ease forwards;
            animation-delay: 0.9s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        .subheader {
            text-align: center;
            color: #6b8e23;
            font-size: 1.1em;
            margin: 25px 0;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 1.1s;
        }
        
        .details {
            text-align: center;
            margin: 30px 0;
            line-height: 2;
        }
        
        .detail-item {
            margin: 15px 0;
            font-size: 1.15em;
            color: #3d5a1f;
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
        }
        
        .detail-item.date {
            animation-delay: 1.3s;
        }
        
        .detail-item.time {
            animation-delay: 1.5s;
        }
        
        .detail-item.venue {
            animation-delay: 1.7s;
        }
        
        .icon {
            display: inline-block;
            margin-right: 8px;
            font-size: 1.2em;
            animation: pulse 2s infinite;
        }
        
        .venue-name {
            font-weight: 600;
            color: #6b8e23;
        }
        
        .closing {
            text-align: center;
            margin-top: 35px;
            font-size: 1em;
            color: #6b8e23;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 1.9s;
        }
        

        
        /* Floating leaves decoration */
        .leaf {
            position: absolute;
            font-size: 1.5em;
            opacity: 0;
            animation: floatLeaf 5s infinite ease-in-out;
        }
        
        .leaf:nth-child(1) { top: 80px; left: 30px; animation-delay: 0s; }
        .leaf:nth-child(2) { top: 120px; right: 40px; animation-delay: 1.5s; }
        .leaf:nth-child(3) { bottom: 100px; left: 50px; animation-delay: 3s; }
        .leaf:nth-child(4) { bottom: 80px; right: 35px; animation-delay: 4.5s; }
        
        /* Animations */
        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        @keyframes fadeInCorner {
            to {
                opacity: 0.6;
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes slideInScale {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes expandWidth {
            from { width: 0; }
            to { width: 150px; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }
        
        @keyframes rotate {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-15deg);
            }
            75% {
                transform: rotate(15deg);
            }
        }
        
        @keyframes floatLeaf {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            25% {
                opacity: 0.6;
                transform: translateY(-20px) rotate(90deg);
            }
            50% {
                opacity: 0.8;
                transform: translateY(-40px) rotate(180deg);
            }
            75% {
                opacity: 0.6;
                transform: translateY(-20px) rotate(270deg);
            }
            100% {
                opacity: 0;
                transform: translateY(0) rotate(360deg);
            }
        }
        
        @keyframes buttonPulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4),
                            inset 0 0 20px rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 10px 40px rgba(212, 175, 55, 0.7),
                            inset 0 0 30px rgba(255, 255, 255, 0.3),
                            0 0 30px rgba(212, 175, 55, 0.5);
            }
        }
        
        @keyframes bounceIcon {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        
        @media (max-width: 600px) {
            .card {
                padding: 40px 30px;
            }
            
            .names {
                font-size: 2.2em;
            }
            
            .detail-item {
                font-size: 1em;
            }
            
            /* Disable all heavy animations on mobile */
            .card::before {
                animation: none !important;
                opacity: 0.3;
            }
            
            .leaf {
                animation-duration: 10s !important;
            }
            
            .ampersand {
                animation: none !important;
            }
            
            .icon {
                animation: none !important;
            }
            
            .decorative-top span {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <!-- Decorative corners -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            
            <!-- Floating leaves -->
            <div class="leaf">🍃</div>
            <div class="leaf">🍃</div>
            <div class="leaf">🍃</div>
            <div class="leaf">🍃</div>
            
            <div class="content">
                <div class="header">Together With Their Families</div>
                
                <div class="decorative-top">
                    <span>✨</span>
                    <span>💚</span>
                    <span>✨</span>
                </div>
                
                <div class="names">Jintu <span class="ampersand">&</span> Sam</div>
                
                <div class="divider"></div>
                
                <div class="subheader">Joyfully invite you to celebrate their Engagement</div>
                
                <div class="details">
                    <div class="detail-item date">
                        <span class="icon">📅</span>
                        <strong>Saturday, 17th January 2025</strong>
                    </div>
                    
                    <div class="detail-item time">
                        <span class="icon">🕐</span>
                        <strong>12:00 PM</strong>
                    </div>
                    
                    <div class="detail-item venue">
                        <span class="icon">⛪</span>
                        <span class="venue-name">Nava Nusreth Church</span><br>
                        Kumarakom
                    </div>
                </div>
                
                <div class="closing">
                    Your presence will make our day even more special
                </div>
            </div>
        </div>
    </div>
</body>
</html>
